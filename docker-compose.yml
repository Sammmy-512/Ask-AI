services:
  postgres:
    image: pgvector/pgvector:pg17

    container_name: ask-ai-db

    environment:
      POSTGRES_USER: ASK-AI
      POSTGRES_PASSWORD: ASK-AI
      POSTGRES_DB: ASK-AI

    ports:
      - "5431:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
